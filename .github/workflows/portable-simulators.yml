name: Portable simulator offline checks
on:
  push:
    branches: [feature/offline-golf-simulators]
  pull_request:
    branches: [main]
    paths:
      - 'app/static/**'
      - 'app/templates/**'
      - 'scripts/*simulator*'
      - 'tests/portable_simulators.test.cjs'
      - '.github/workflows/portable-simulators.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install jinja2
      - run: python scripts/build_portable_simulators.py --check
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/portable_simulators.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-tablet-phone-layouts
          path: /tmp/golf-simulators-*.png
          retention-days: 7
