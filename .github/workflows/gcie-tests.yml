name: GCIE isolated tests
on:
  push:
    branches: [feature/gcie-case-knowledge-base]
  pull_request:
    branches: [main]
jobs:
  gcie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests/test_gcie_cases.py
